<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ALIREZA.exe developer banner</title>
  <desc id="desc">Dark navy cyber terminal banner with green neon lines and developer identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e7a2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#34e7a2" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7d94ae" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <path d="M0 76H1200" stroke="#26364c" stroke-width="1"/>
  <path d="M44 76H270" stroke="url(#line)" stroke-width="2"/>
  <circle cx="48" cy="39" r="5" fill="#34e7a2"/>
  <text x="65" y="44" fill="#34e7a2" font-family="monospace" font-size="15" letter-spacing="2">SYSTEM ONLINE</text>
  <text x="1155" y="44" fill="#34e7a2" font-family="monospace" font-size="15" text-anchor="end">ALIREZA.exe  ›_</text>
  <g fill="none" stroke="#34e7a2" stroke-opacity=".24">
    <path d="M865 110h245v145h-245z"/>
    <path d="M895 135h185M895 158h143M895 181h164M895 204h122M895 227h150"/>
    <path d="M840 125h16v16h-16zM1117 236h16v16h-16z"/>
  </g>
  <g fill="#34e7a2" opacity=".7" font-family="monospace" font-size="11">
    <text x="883" y="99">~/profile/README.md</text>
    <text x="895" y="126">const mindset = "keep_building";</text>
  </g>
  <text x="56" y="139" fill="#9aa9bd" font-family="monospace" font-size="15" letter-spacing="3">PROGRAMMER / WEB DEVELOPER / DEVOPS EXPLORER</text>
  <text x="52" y="211" fill="#f1f5f9" font-family="monospace" font-size="57" font-weight="700" letter-spacing="-2">ALIREZA<span fill="#34e7a2">.exe</span></text>
  <text x="56" y="250" fill="#c4cfdd" font-family="monospace" font-size="20">Building. Automating. Deploying.</text>
  <path d="M56 281H770" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <text x="56" y="310" fill="#34e7a2" font-family="monospace" font-size="13" letter-spacing="2">JAVASCRIPT · NODE.JS · PYTHON · LINUX · DOCKER · CI/CD</text>
  <text x="1148" y="310" fill="#8a9bb1" font-family="monospace" font-size="12" text-anchor="end">[ BUILD / TEST / DEPLOY ]</text>
</svg>
